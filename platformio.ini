[env:waveshare-esp-c3-32s-kit]
platform = espressif32
; The Waveshare board has no dedicated PlatformIO manifest. The DevKitM target
; supplies the correct ESP32-C3 Arduino toolchain; flash is overridden to match
; the ESP-C3-32S module fitted to this board.
board = esp32-c3-devkitm-1
board_build.flash_size = 2MB
board_upload.flash_size = 2MB
board_build.partitions = minimal.csv
framework = arduino
monitor_speed = 115200
; Core 2.x defaults to gnu++11, where PaddleState's default member
; initializers stop it being an aggregate. Pin the standard so the build
; matches on cores that default to gnu++2b.
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
lib_deps =
  links2004/WebSockets@^2.4.1
  adafruit/Adafruit GFX Library@^1.11.11
  adafruit/Adafruit SSD1306@^2.5.13
